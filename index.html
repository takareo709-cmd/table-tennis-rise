<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TABLE TENNIS RISE - Rally Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071116;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:relative;width:min(100vw,560px);height:100dvh;margin:auto;overflow:hidden;background:linear-gradient(#16272d,#071116)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2;pointer-events:none}
.panel{background:#061116dd;border:1px solid #ffffff22;border-radius:14px;padding:8px 12px;color:#fff;font-weight:900;backdrop-filter:blur(8px)}
#status{position:absolute;top:72px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:18px;text-shadow:0 3px 8px #000;z-index:2;white-space:nowrap}
#serve{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:3;border:0;border-radius:17px;padding:14px 30px;font-size:16px;font-weight:900;background:#fff;color:#071116}
#help{position:absolute;bottom:10px;left:10px;right:10px;text-align:center;color:#dce7e9;font-size:11px;pointer-events:none;z-index:2}
#overlay{display:none;position:absolute;inset:0;z-index:5;background:#000b;align-items:center;justify-content:center}
.card{width:82%;background:#10242b;color:#fff;border:1px solid #ffffff22;border-radius:24px;padding:28px;text-align:center}
.card button{border:0;border-radius:13px;padding:12px 26px;font-weight:900}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud">
 <div class="panel">YOU <span id="you">0</span>　CPU <span id="cpu">0</span></div>
 <div class="panel">GAME <span id="gameNo">1</span>　<span id="games">0 - 0</span></div>
</div>
<div id="status"></div>
<button id="serve">サーブする</button>
<div id="help">ボールが手前に来た瞬間にスワイプ　←→コース　↑強打　↓ゆるく</div>
<div id="overlay"><div class="card"><h2 id="overTitle"></h2><p id="overText"></p><button id="overBtn">続ける</button></div></div>
</div>

<script>
(()=>{"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,D=1,last=0,gesture=null;

const state={
 phase:"serve", server:"you", serveHits:0,
 scoreYou:0,scoreCpu:0,gamesYou:0,gamesCpu:0,game:1,
 rally:0
};

const ball={
 u:.50, v:.76, z:.06, du:0, dv:0, dz:0,
 side:"cpu", bounce:false, targetU:.50,
 flight:0
};
const player={u:.50,target:.50,stroke:0};
const cpu={u:.50,target:.50,stroke:0};

function resize(){
 const r=canvas.getBoundingClientRect();
 W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);
 canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);
}
addEventListener("resize",resize);resize();

function table(){
 return {x:W*.08,y:H*.18,w:W*.84,h:H*.57,netY:H*.465};
}
function clamp(n,a=0.05,b=0.95){return Math.max(a,Math.min(b,n));}
function updateUI(){
 $("you").textContent=state.scoreYou;
 $("cpu").textContent=state.scoreCpu;
 $("games").textContent=state.gamesYou+" - "+state.gamesCpu;
 $("gameNo").textContent=state.game;
}
function status(s,ms=700){
 $("status").textContent=s;
 clearTimeout(status.t);
 if(ms)status.t=setTimeout(()=>$("status").textContent="",ms);
}
function showServe(){
 state.phase="serve";
 ball.bounce=false;
 player.u=player.target=.5;cpu.u=cpu.target=.5;
 $("serve").style.display=state.server==="you"?"block":"none";
 status(state.server==="you"?"あなたのサーブ":"CPUサーブ");
 if(state.server==="cpu")setTimeout(cpuServe,850);
}
function nextServer(){
 state.serveHits++;
 if(state.serveHits>=2){
   state.serveHits=0;
   state.server=state.server==="you"?"cpu":"you";
 }
}
function startMatch(){
 state.gamesYou=state.gamesCpu=0;state.game=1;
 startGame();
}
function startGame(){
 state.scoreYou=state.scoreCpu=0;
 state.serveHits=0;
 state.server="you";
 state.rally=0;
 showServe();updateUI();
}
function award(who){
 if(who==="you")state.scoreYou++;else state.scoreCpu++;
 updateUI();status(who==="you"?"POINT!":"CPU POINT");
 if((state.scoreYou>=11||state.scoreCpu>=11)&&Math.abs(state.scoreYou-state.scoreCpu)>=2){
   const won=state.scoreYou>state.scoreCpu;
   if(won)state.gamesYou++;else state.gamesCpu++;
   const match=state.gamesYou>=2||state.gamesCpu>=2;
   state.phase=match?"matchover":"gameover";
   $("overlay").style.display="flex";
   $("overTitle").textContent=match?(won?"🏆 MATCH WIN":"MATCH LOST"):(won?"GAME WON":"GAME LOST");
   $("overText").textContent=`${state.scoreYou} - ${state.scoreCpu}　　ゲーム ${state.gamesYou} - ${state.gamesCpu}`;
   $("overBtn").textContent=match?"もう一度":"次のゲーム";
   return;
 }
 nextServer();showServe();
}

function serve(from){
 const left=.18+Math.random()*.64;
 Object.assign(ball,{
   u:.50,v:from==="you"?.78:.22,z:.07,
   du:(left-.50)*.055,dv:from==="you"?-.0105:.0105,dz:.0145,
   side:from==="you"?"cpu":"you",bounce:false,targetU:left,flight:0
 });
 state.phase="serveFlight";
}
function playerServe(){
 if(state.phase!=="serve"||state.server!=="you")return;
 $("serve").style.display="none";serve("you");status("SERVE");
}
function cpuServe(){
 if(state.phase!=="serve"||state.server!=="cpu")return;
 serve("cpu");status("CPU SERVE");
}

function playerReturn(dx,dy){
 if(state.phase!=="rally"||ball.side!=="you")return;
 if(ball.v>0.61||ball.v<.54)return; // timing window
 const len=Math.hypot(dx,dy)||1;
 const nx=dx/len,ny=dy/len;
 const target=clamp(ball.u+nx*.34);
 const strength=clamp(.52 + (-ny)*.22,.36,.86);

 player.target=target;
 player.stroke=Math.min(1,Math.abs(dx)+Math.abs(dy))/180;

 ball.side="cpu";
 ball.u=player.u;
 ball.v=.72;
 ball.z=.08;
 ball.du=(target-ball.u)*(.075+strength*.025);
 ball.dv=-(.0105+strength*.0015);
 ball.dz=.0142+strength*.0022;
 ball.targetU=target;
 ball.bounce=false;
 state.rally++;
 status(strength>.72?"STRONG!":"RETURN",350);
}

function cpuReturn(){
 if(state.phase!=="rally"||ball.side!=="cpu")return;
 const target=clamp(ball.u+(Math.random()-.5)*.42);
 cpu.target=target;cpu.stroke=1;
 ball.side="you";
 ball.u=cpu.u;
 ball.v=.28;
 ball.z=.08;
 ball.du=(target-ball.u)*.075;
 ball.dv=.0105;
 ball.dz=.0142;
 ball.targetU=target;
 ball.bounce=false;
 state.rally++;
}

function physics(dt){
 if(state.phase!=="serveFlight"&&state.phase!=="rally")return;

 const k=dt*60;
 ball.u+=ball.du*k;
 ball.v+=ball.dv*k;
 ball.z+=ball.dz*k;
 ball.dz-=.00072*k;

 player.u+=(player.target-player.u)*Math.min(1,dt*8);
 cpu.u+=(cpu.target-cpu.u)*Math.min(1,dt*6);
 player.stroke*=Math.max(0,1-dt*7);
 cpu.stroke*=Math.max(0,1-dt*7);

 if(ball.z<=0){
   ball.z=0;

   // The visual table is exactly the legal playing rectangle.
   const legal=ball.u>=.02&&ball.u<=.98&&ball.v>=.02&&ball.v<=.98;
   if(!legal){award(ball.side==="you"?"cpu":"you");return;}

   if(state.phase==="serveFlight"){
     if(!ball.bounce){
       const correctFirst=state.server==="you"?ball.v>.455:ball.v<.455;
       if(correctFirst){ball.bounce=true;ball.dz=.0145;return;}
       award(state.server==="you"?"cpu":"you");return;
     }else{
       const correctSecond=state.server==="you"?ball.v<.455:ball.v>.455;
       if(correctSecond){
         state.phase="rally";
         ball.side=state.server==="you"?"cpu":"you";
         ball.dz=.0142;
         if(ball.side==="cpu")setTimeout(cpuReturn,620);
         return;
       }
       award(state.server==="you"?"cpu":"you");return;
     }
   }

   const legalSide=ball.side==="you"?ball.v>.455:ball.v<.455;
   if(!legalSide){award(ball.side==="you"?"cpu":"you");return;}

   ball.dz=.0142;
   if(ball.side==="cpu")setTimeout(cpuReturn,620);
 }

 if(ball.u<-.08||ball.u>1.08||ball.v<-.08||ball.v>1.08){
   award(ball.side==="you"?"cpu":"you");
 }
}

function drawCourt(){
 const t=table();
 const nearL=t.x,nearR=t.x+t.w;
 const farL=t.x+t.w*.13,farR=t.x+t.w*.87;

 ctx.fillStyle="#071116";ctx.fillRect(0,0,W,H);

 // floor
 ctx.fillStyle="#0b1c21";ctx.fillRect(0,t.y+t.h*.88,W,H);

 // real table perspective
 ctx.fillStyle="#126d7b";
 ctx.beginPath();
 ctx.moveTo(farL,t.y);
 ctx.lineTo(farR,t.y);
 ctx.lineTo(nearR,t.y+t.h);
 ctx.lineTo(nearL,t.y+t.h);
 ctx.closePath();ctx.fill();

 ctx.strokeStyle="#f7fbfb";ctx.lineWidth=2;ctx.stroke();

 // center line
 ctx.beginPath();
 ctx.moveTo((farL+farR)/2,t.y);
 ctx.lineTo((nearL+nearR)/2,t.y+t.h);
 ctx.stroke();

 // net
 ctx.fillStyle="#16272c";
 ctx.fillRect(t.x-3,t.netY-6,t.w+6,12);
 ctx.strokeStyle="#e9eeee";ctx.strokeRect(t.x-3,t.netY-6,t.w+6,12);

 // legs and frame
 ctx.strokeStyle="#263a40";ctx.lineWidth=8;
 ctx.beginPath();
 ctx.moveTo(nearL+t.w*.16,t.y+t.h);ctx.lineTo(nearL+t.w*.16,H-18);
 ctx.moveTo(nearR-t.w*.16,t.y+t.h);ctx.lineTo(nearR-t.w*.16,H-18);
 ctx.stroke();

 // incoming target marker
 if(state.phase==="rally"&&ball.side==="you"){
   const px=t.x+ball.u*t.w,py=t.y+ball.v*t.h;
   ctx.strokeStyle="#ffffff99";ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(px,py,25,0,Math.PI*2);ctx.stroke();
 }
}

function drawAvatar(x,y,red,stroke){
 ctx.save();ctx.translate(x,y);
 const s=1+stroke*.08;ctx.scale(s,s);
 ctx.fillStyle=red?"#bd4050":"#15869d";
 ctx.beginPath();ctx.roundRect(-22,-30,44,52,10);ctx.fill();

 ctx.fillStyle="#dcbba1";ctx.beginPath();ctx.arc(0,-46,16,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#202427";ctx.beginPath();ctx.arc(0,-50,16,Math.PI,Math.PI*2);ctx.fill();

 ctx.strokeStyle="#dcbba1";ctx.lineWidth=8;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-15,-8);ctx.lineTo(-30,15);ctx.moveTo(15,-8);ctx.lineTo(30,15);ctx.stroke();

 ctx.strokeStyle="#e3e7e8";ctx.beginPath();
 ctx.moveTo(-8,21);ctx.lineTo(-16,49);ctx.moveTo(8,21);ctx.lineTo(16,49);ctx.stroke();

 // racket
 ctx.strokeStyle="#bd8757";ctx.lineWidth=4;
 ctx.beginPath();ctx.moveTo(29,13);ctx.lineTo(43,27);ctx.stroke();
 ctx.fillStyle="#8c5138";ctx.beginPath();ctx.ellipse(45,9,8,11,.35,0,Math.PI*2);ctx.fill();
 ctx.restore();
}

function drawBall(){
 const t=table();
 const px=t.x+ball.u*t.w;
 const py=t.y+ball.v*t.h-ball.z*H*.42;
 const r=5.7+ball.z*18;

 ctx.fillStyle="#0008";
 ctx.beginPath();ctx.ellipse(px+2,py+7,r*1.25,r*.45,0,0,Math.PI*2);ctx.fill();

 ctx.fillStyle="#fff3b0";
 ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#ffffffaa";ctx.lineWidth=1;ctx.stroke();
}

function draw(){
 drawCourt();
 const t=table();
 drawAvatar(t.x+t.w*.50+player.u*2-1,t.y+t.h+62,false,player.stroke);
 drawAvatar(t.x+t.w*.50+cpu.u*2-1,t.y-50,true,cpu.stroke);
 drawBall();
}

function loop(ts){
 const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
 physics(dt);draw();requestAnimationFrame(loop);
}

canvas.addEventListener("pointerdown",e=>{
 if(state.phase==="rally"&&ball.side==="you")gesture={x:e.clientX,y:e.clientY};
});
canvas.addEventListener("pointerup",e=>{
 if(!gesture)return;
 const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;
 if(Math.hypot(dx,dy)>10)playerReturn(dx,dy);
});

$("serve").onclick=playerServe;
$("overBtn").onclick=()=>{
 $("overlay").style.display="none";
 if(state.phase==="matchover")startMatch();
 else {state.game++;startGame();}
};

startMatch();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
