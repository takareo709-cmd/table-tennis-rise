<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071018">
<title>TABLE TENNIS RISE</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{overscroll-behavior:none}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#17394b 0,#071018 55%,#03070a 100%)}
header{height:58px;padding:env(safe-area-inset-top) 12px 7px;min-height:58px;display:flex;align-items:flex-end;justify-content:space-between;background:#07131c;border-bottom:1px solid #294651}
.brand{font-size:13px;font-weight:900;letter-spacing:.6px}.gamecount{font-size:18px;font-weight:900}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.card{background:#061019d9;border:1px solid #48616b;border-radius:11px;padding:7px 10px;font-size:12px;backdrop-filter:blur(8px)}
#msg{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:25px;font-weight:900;text-shadow:0 3px 15px #000;pointer-events:none;white-space:nowrap}
#help{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:#c5d5da;white-space:nowrap;pointer-events:none}
#controls{height:88px;min-height:88px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#071018;border-top:1px solid #294651}
button{appearance:none;border:1px solid #42606b;border-radius:14px;background:#10242e;color:#fff;font-weight:900;font-size:11px}
button:active{transform:scale(.97);background:#176f8d}
#overlay{display:none;position:absolute;inset:0;z-index:20;background:#000b;align-items:center;justify-content:center;padding:22px}
.panel{width:min(410px,100%);padding:24px;border-radius:20px;text-align:center;background:#0a1720;border:1px solid #45616c;box-shadow:0 20px 60px #000}
.panel h1{margin:0 0 10px;font-size:27px}.panel p{color:#bfd0d7;line-height:1.5}.panel button{width:100%;height:50px;margin-top:8px;background:#197c9a;border:0;font-size:14px}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">🏓 TABLE TENNIS RISE</div><div class="gamecount">GAME <span id="gn">1</span>　<span id="gc">0 - 0</span></div></header>
<div id="stage">
<canvas id="game"></canvas>
<div class="hud">
<div class="card">YOU　<b id="ps">0</b></div>
<div class="card">RALLY　<b id="rl">0</b></div>
<div class="card">CPU　<b id="cs">0</b></div>
</div>
<div id="msg">READY</div>
<div id="help">ボールが来たらスワイプ　↑ドライブ　↓ツッツキ　←→コース</div>
<div id="overlay"><div class="panel"><h1 id="ot"></h1><p id="op"></p><button id="ob"></button></div></div>
</div>
<div id="controls">
<button data-s="drive">🏓<br>ドライブ</button>
<button data-s="push">🟢<br>ツッツキ</button>
<button data-s="flick">🔵<br>フリック</button>
<button data-s="smash">💥<br>スマッシュ</button>
</div>
</div>
<script>
(()=>{"use strict";
const cv=document.getElementById("game"),ctx=cv.getContext("2d");
const ps=document.getElementById("ps"),cs=document.getElementById("cs"),rl=document.getElementById("rl"),gc=document.getElementById("gc"),gn=document.getElementById("gn"),msg=document.getElementById("msg");
const ov=document.getElementById("overlay"),ot=document.getElementById("ot"),op=document.getElementById("op"),ob=document.getElementById("ob");
let W=0,H=0,D=1,last=0,state="rally",game=1,pGames=0,cGames=0,p=0,c=0,rally=0,serve="player",touch=null,pending=0,style="counter";
const ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,side:"player",spin:0};

function resize(){const r=cv.getBoundingClientRect();D=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();
function T(){return{x:W*.07,y:H*.24,w:W*.86,h:H*.47,net:H*.475}}
function ui(){ps.textContent=p;cs.textContent=c;rl.textContent=rally;gc.textContent=pGames+" - "+cGames;gn.textContent=game}
function say(t,ms=650){msg.textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>msg.textContent="",ms)}
function reset(side){const t=T();pending=0;ball.side=side;ball.x=side==="player"?t.x+t.w*.28:t.x+t.w*.72;ball.y=side==="player"?t.y+t.h*.72:t.y+t.h*.28;ball.z=.08;ball.vx=0;ball.vy=side==="player"?-1.04:1.04;ball.vz=.02;ball.spin=0}
function start(){p=c=rally=0;serve="player";style=["attack","counter","defense","allround"][Math.floor(Math.random()*4)];state="rally";reset("player");ui();say("GAME "+game,900)}
function point(who){
if(state!=="rally")return;
who==="player"?p++:c++;ui();
if((p>=11||c>=11)&&Math.abs(p-c)>=2){endGame(who);return}
state="pause";serve=who==="player"?"cpu":"player";say(who==="player"?"POINT!":"CPU POINT",550);
setTimeout(()=>{reset(serve);state="rally";say("SERVE",450)},600)
}
function endGame(who){
state="gameover";who==="player"?pGames++:cGames++;ui();const match=pGames>=2||cGames>=2;
ot.textContent=match?(pGames>cGames?"🏆 MATCH WIN!":"MATCH LOST"):(who==="player"?"GAME WON!":"GAME LOST");
op.textContent=match?("3ゲームマッチ終了　"+pGames+" - "+cGames):("GAME "+game+" 終了　ゲームカウント "+pGames+" - "+cGames);
ob.textContent=match?"もう一度プレイ":"次のゲーム";ov.style.display="flex";
ob.onclick=()=>{ov.style.display="none";if(match){pGames=0;cGames=0;game=1}else game++;start()}
}
function hit(type,dx,dy){
if(state!=="rally"||ball.side!=="player")return;
pending=0;const t=T(),len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
const power={drive:1.1,push:.78,flick:1,smash:1.3}[type],spin={drive:.9,push:.3,flick:.7,smash:.5}[type];
const target=Math.max(t.x+t.w*.08,Math.min(t.x+t.w*.92,ball.x+dx*t.w*.45));
ball.vx=(target-ball.x)*.025*power;ball.vy=-(.82+.25*power);ball.vz=.028+.018*power;ball.spin=spin*(dx<0?-1:1);ball.side="cpu";rally++;ui();say(type==="drive"?"DRIVE!":type==="push"?"PUSH":type==="flick"?"FLICK!":"SMASH!",300)
}
function cpuReturn(){
if(state!=="rally"||ball.side!=="cpu")return;
const miss=style==="defense"?.075:style==="attack"?.035:style==="counter"?.03:.055;
if(Math.random()<miss){point("player");return}
const t=T(),target=t.x+t.w*(Math.random()<.5?.2:.8);
ball.vx=(target-ball.x)*.022;ball.vy=.84+Math.random()*.22;ball.vz=.028+Math.random()*.02;ball.spin=(Math.random()-.5)*.8;ball.side="player"
}
function physics(dt){
if(state!=="rally")return;
const t=T();ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.z+=ball.vz*dt*60;ball.vz-=.0025*dt*60;
if(ball.z<0){ball.z=0;ball.vz=Math.abs(ball.vz)*.82}
if(ball.x<t.x-.1*t.w||ball.x>t.x+1.1*t.w||ball.y<t.y-.18*t.h||ball.y>t.y+1.18*t.h){point(ball.side==="player"?"cpu":"player");return}
if(ball.side==="cpu"&&ball.y<t.y+t.h*.29){cpuReturn();return}
if(ball.side==="player"&&ball.y>t.y+t.h*.70&&!pending){pending=1;setTimeout(()=>{if(pending&&state==="rally"){pending=0;point("cpu")}},850)}
}
function player(xp,yp,cpu){ctx.save();ctx.translate(xp,yp);ctx.fillStyle=cpu?"#aa3945":"#1680a1";ctx.beginPath();ctx.arc(0,-30,12,0,Math.PI*2);ctx.fill();ctx.fillRect(-14,-18,28,34);ctx.fillStyle="#172029";ctx.fillRect(-12,16,9,24);ctx.fillRect(3,16,9,24);ctx.restore()}
function draw(){
ctx.clearRect(0,0,W,H);const t=T();ctx.fillStyle="#081118";ctx.fillRect(0,0,W,H);
ctx.fillStyle="#0c3140";ctx.fillRect(t.x+6,t.y+10,t.w,t.h);ctx.fillStyle="#155b70";ctx.fillRect(t.x,t.y,t.w,t.h);
ctx.strokeStyle="#e9f4f5";ctx.lineWidth=2;ctx.strokeRect(t.x,t.y,t.w,t.h);ctx.beginPath();ctx.moveTo(t.x+t.w/2,t.y);ctx.lineTo(t.x+t.w/2,t.y+t.h);ctx.stroke();
ctx.fillStyle="#17272e";ctx.fillRect(t.x-3,t.net-5,t.w+6,10);player(t.x+t.w/2,t.y+t.h*.98,false);player(t.x+t.w/2,t.y-.02*t.h,true);
const bx=ball.x,by=ball.y-ball.z*H*.3,br=5+ball.z*5;ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(bx+2,by+3,br+2,0,Math.PI*2);ctx.fill();ctx.fillStyle="#f4f0ce";ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill()
}
function loop(t){const dt=Math.min(.035,(t-last)/1000||.016);last=t;physics(dt);draw();requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",e=>{if(state==="rally"&&ball.side==="player")touch={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)<14)return;const type=dy<-30?(Math.abs(dx)<55?"drive":"flick"):"push";hit(type,dx,dy)});
document.querySelectorAll("#controls button").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.s;hit(s,Math.random()<.5?-1:1,s==="push"?1:-1)}));
start();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
