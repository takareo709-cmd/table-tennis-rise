<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TABLE TENNIS RISE</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;flex-direction:column}header{height:55px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#091a22;font-weight:900}.title{font-size:13px}#games{font-size:17px}#stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#07131ddd;border:1px solid #49616a;border-radius:9px;padding:6px 9px;font-size:12px}#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;text-shadow:0 3px 14px #000;white-space:nowrap}#serve{display:none;position:absolute;bottom:22px;left:50%;transform:translateX(-50%);border:0;border-radius:14px;padding:13px 30px;background:#1686a7;color:white;font-weight:900;font-size:15px}#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#cbd8dc}#controls{height:80px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;background:#071018}button{border:1px solid #405a64;border-radius:12px;background:#10242d;color:white;font-weight:900}button:active{background:#176d88}#over{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.panel{background:#091821;border:1px solid #536a72;border-radius:20px;padding:22px;width:min(380px,92%);text-align:center}.panel button{width:100%;height:46px;background:#1686a7;border:0;margin-top:10px}</style></head>
<body><header><div class="title">🏓 TABLE TENNIS RISE</div><div id="games">G1　0 - 0</div></header><div id="stage"><canvas id="c"></canvas><div id="hud"><div class="box">YOU <b id="p">0</b></div><div class="box">RALLY <b id="r">0</b></div><div class="box">CPU <b id="q">0</b></div></div><div id="msg"></div><button id="serve">サーブする</button><div id="hint">スワイプ ↑ドライブ ↓ツッツキ　左右でコース</div><div id="over"><div class="panel"><h2 id="ot"></h2><p id="tx"></p><button id="next"></button></div></div></div><div id="controls"><button data-a="drive">🏓<br>ドライブ</button><button data-a="push">🟢<br>ツッツキ</button><button data-a="flick">🔵<br>フリック</button><button data-a="smash">💥<br>スマッシュ</button></div>
<script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),$=s=>document.querySelector(s),p=$('#p'),q=$('#q'),r=$('#r'),games=$('#games'),msg=$('#msg'),serve=$('#serve'),over=$('#over'),ot=$('#ot'),tx=$('#tx'),next=$('#next');let W,H,d=1,last=0,phase='serve',server='p',serves=0,ps=0,qs=0,pg=0,qg=0,gn=1,rally=0,touch=null,missTimer=0;const b={x:0,y:0,z:.04,vx:0,vy:0,vz:0,receiver:'q',serve:false,b1:false,b2:false};
function resize(){let z=c.getBoundingClientRect();W=z.width;H=z.height;d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function T(){return{x:W*.08,y:H*.19,w:W*.84,h:H*.53,net:H*.455}}function ui(){p.textContent=ps;q.textContent=qs;r.textContent=rally;games.textContent='G'+gn+'　'+pg+' - '+qg}function say(s,t=700){msg.textContent=s;clearTimeout(say.t);if(t)say.t=setTimeout(()=>msg.textContent='',t)}function on(){let t=T();return b.x>=t.x&&b.x<=t.x+t.w&&b.y>=t.y&&b.y<=t.y+t.h}
function point(w){if(w==='p')ps++;else qs++;ui();say(w==='p'?'POINT!':'CPU POINT');if((ps>=11||qs>=11)&&Math.abs(ps-qs)>=2){let gw=ps>qs?'p':'q';gw==='p'?pg++:qg++;ui();let done=pg>=2||qg>=2;phase=done?'matchover':'gameover';over.style.display='flex';ot.textContent=done?(pg>qg?'🏆 MATCH WIN':'MATCH LOST'):(gw==='p'?'GAME WON':'GAME LOST');tx.textContent=done?'3ゲームマッチ '+pg+' - '+qg:'ゲーム'+gn+'　'+ps+' - '+qs;next.textContent=done?'もう一度':'次のゲーム';return}serves++;if(serves>=2){serves=0;server=server==='p'?'q':'p'}resetPoint()}
function resetPoint(){phase='serve';b.b1=b.b2=false;b.serve=false;serve.style.display=server==='p'?'block':'none';say(server==='p'?'あなたのサーブ':'CPUサーブ',0);if(server==='q')setTimeout(cpuServe,650)}function resetGame(){ps=qs=0;serves=0;server='p';rally=0;resetPoint()}function newMatch(){pg=qg=0;gn=1;resetGame()}
function playerServe(){if(phase!=='serve'||server!=='p')return;let t=T();serve.style.display='none';Object.assign(b,{x:t.x+t.w/2,y:t.y+t.h*.77,z:.04,vx:(Math.random()-.5)*.02,vy:-.44,vz:.022,receiver:'q',serve:true,b1:false,b2:false});phase='flight';say('SERVE')}
function cpuServe(){if(phase!=='serve'||server!=='q')return;let t=T();Object.assign(b,{x:t.x+t.w/2,y:t.y+t.h*.23,z:.04,vx:(Math.random()-.5)*.02,vy:.44,vz:.022,receiver:'p',serve:true,b1:false,b2:false});phase='flight';say('CPU SERVE')}
function hit(type,dx){if(phase!=='rally'||b.receiver!=='p')return;missTimer=0;let t=T(),pow={drive:1,push:.72,flick:.9,smash:1.15}[type],target=Math.max(t.x+t.w*.07,Math.min(t.x+t.w*.93,b.x+dx*.45*t.w));b.vx=(target-b.x)*.055*pow;b.vy=-(.43+.045*pow);b.vz=.024+.008*pow;b.receiver='q';rally++;ui();say(type.toUpperCase(),250)}
function cpuHit(){if(phase!=='rally'||b.receiver!=='q')return;let t=T();if(Math.random()<.06)return point('p');let target=t.x+t.w*(.12+Math.random()*.76);b.vx=(target-b.x)*.055;b.vy=.43+Math.random()*.06;b.vz=.024+Math.random()*.008;b.receiver='p';rally++;ui()}
function physics(dt){let t=T();if(phase!=='flight'&&phase!=='rally')return;b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;b.z+=b.vz*dt*60;b.vz-=.0019*dt*60;if(b.z<0)b.z=0;
if(phase==='flight'){if(b.serve&&b.receiver==='q'){if(!b.b1&&b.y>=t.net){if(on()){b.b1=true;b.vz=.022;say('1st BOUNCE',250)}else return point('q')}if(b.b1&&!b.b2&&b.y<=t.net){if(on()){b.b2=true;phase='rally';b.receiver='q';say('PLAY!',300)}else return point('q')}if(b.y<t.y-t.h*.08||b.x<t.x||b.x>t.x+t.w)return point('q')}else{if(!b.b1&&b.y<=t.net){if(on()){b.b1=true;b.vz=.022;say('1st BOUNCE',250)}else return point('p')}if(b.b1&&!b.b2&&b.y>=t.net){if(on()){b.b2=true;phase='rally';b.receiver='p';say('PLAY!',300)}else return point('p')}if(b.y>t.y+t.h+t.h*.08||b.x<t.x||b.x>t.x+t.w)return point('p')}return}
if(b.z<=.001){if(!on())return point(b.receiver==='p'?'q':'p');let ph=b.y>t.net;if(b.receiver==='q'&&!ph){b.z=.001;b.vz=.024;b.receiver='p'}else if(b.receiver==='p'&&ph){b.z=.001;b.vz=.024;b.receiver='q'}else return point(b.receiver==='p'?'q':'p')}
if(b.x<t.x||b.x>t.x+t.w||b.y<t.y-t.h*.08||b.y>t.y+t.h+t.h*.08)return point(b.receiver==='p'?'q':'p');if(b.receiver==='q'&&b.y<t.net+t.h*.07&&b.z<.1)setTimeout(cpuHit,100);if(b.receiver==='p'&&b.y>t.net-t.h*.07&&b.z<.1&&missTimer===0){missTimer=1;setTimeout(()=>{if(missTimer&&phase==='rally')point('q')},900)}}
function player(px,py,cpu){x.save();x.translate(px,py);x.strokeStyle='#ddd';x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(-7,18);x.lineTo(-17,57);x.moveTo(7,18);x.lineTo(17,57);x.stroke();x.fillStyle=cpu?'#b63c4b':'#1681a1';x.beginPath();x.roundRect(-23,-30,46,50,8);x.fill();x.fillStyle='#dfbea3';x.beginPath();x.arc(0,-47,16,0,7);x.fill();x.fillStyle='#24282a';x.beginPath();x.arc(0,-52,16,3.2,6.2);x.fill();x.strokeStyle='#dfbea3';x.lineWidth=7;x.beginPath();x.moveTo(-17,-16);x.lineTo(-34,7);x.moveTo(17,-16);x.lineTo(34,5);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,W,H);let t=T();x.fillStyle='#081119';x.fillRect(0,0,W,H);x.fillStyle='#0e1d23';x.fillRect(t.x+t.w*.1,t.y+t.h,8,H-t.y-t.h-10);x.fillRect(t.x+t.w*.9,t.y+t.h,8,H-t.y-t.h-10);x.fillStyle='#126276';x.fillRect(t.x,t.y,t.w,t.h);x.strokeStyle='#eef5f5';x.lineWidth=2;x.strokeRect(t.x,t.y,t.w,t.h);x.beginPath();x.moveTo(t.x,t.net);x.lineTo(t.x+t.w,t.net);x.moveTo(t.x+t.w/2,t.y);x.lineTo(t.x+t.w/2,t.y+t.h);x.stroke();x.fillStyle='#17272d';x.fillRect(t.x-3,t.net-7,t.w+6,14);x.strokeRect(t.x-3,t.net-7,t.w+6,14);player(t.x+t.w/2,t.y+t.h+7,false);player(t.x+t.w/2,t.y-6,true);let by=b.y-b.z*H*.4; x.fillStyle='#f6efc8';x.beginPath();x.arc(b.x,by,4+b.z*12,0,7);x.fill()}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;physics(dt);draw();requestAnimationFrame(loop)}
c.addEventListener('pointerdown',e=>{if(phase==='rally'&&b.receiver==='p')touch={x:e.clientX,y:e.clientY}});c.addEventListener('pointerup',e=>{if(!touch)return;let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)<18)return;hit(dy<-35?(Math.abs(dx)<55?'drive':'flick'):'push',dx/Math.max(1,W))});document.querySelectorAll('#controls button').forEach(z=>z.onclick=()=>hit(z.dataset.a,z.dataset.a==='push'?0:-.8));serve.onclick=playerServe;next.onclick=()=>{over.style.display='none';if(phase==='matchover')newMatch();else{gn++;resetGame()}};newMatch();requestAnimationFrame(loop)})();
</script></body></html>
