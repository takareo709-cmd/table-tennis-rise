<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TABLE TENNIS RISE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071116;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{height:100dvh;max-width:540px;margin:auto;position:relative;background:linear-gradient(#14272e,#071116)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;pointer-events:none}
.box{background:#061116dd;border:1px solid #ffffff22;border-radius:13px;padding:8px 11px;font-weight:900}
.msg{position:absolute;top:72px;left:50%;transform:translateX(-50%);color:#fff;font-weight:900;font-size:19px;text-shadow:0 3px 8px #000;white-space:nowrap}
#serve{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);padding:14px 28px;border:0;border-radius:16px;font-size:16px;font-weight:900}
.hint{position:absolute;bottom:15px;left:12px;right:12px;text-align:center;color:#dce5e7;font-size:12px;pointer-events:none}
#over{display:none;position:absolute;inset:0;background:#000a;align-items:center;justify-content:center}
.card{width:80%;background:#102229;color:#fff;border-radius:22px;padding:28px;text-align:center;border:1px solid #ffffff22}
.card button{padding:12px 25px;border:0;border-radius:12px;font-weight:900}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud"><div class="box">YOU <span id="you">0</span>　CPU <span id="cpu">0</span></div><div class="box">GAME <span id="gn">1</span>　<span id="games">0-0</span></div></div>
<div id="msg" class="msg"></div>
<button id="serve">サーブする</button>
<div class="hint">自分側に来たボールをスワイプ　←→コース　↑強く</div>
<div id="over"><div class="card"><h2 id="title"></h2><p id="text"></p><button id="next">続ける</button></div></div>
</div>
<script>
(()=>{
"use strict";
const C=document.getElementById("game"),ctx=C.getContext("2d"),$=id=>document.getElementById(id);
let W=0,H=0,D=1,last=0,touch=null,phase="serve",server="p",serveCount=0,ps=0,cs=0,pg=0,cg=0,gameNo=1;
const ball={x:.5,y:.73,z:.04,vx:0,vy:0,vz:0,receiver:"cpu",firstBounce:false};
const me={x:.5,target:.5},cpu={x:.5,target:.5};
function resize(){const r=C.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);C.width=W*D;C.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();
const T=()=>({x:W*.07,y:H*.20,w:W*.86,h:H*.53,net:H*.455});
const clamp=v=>Math.max(.04,Math.min(.96,v));
function ui(){ $("you").textContent=ps;$("cpu").textContent=cs;$("games").textContent=pg+"-"+cg;$("gn").textContent=gameNo; }
function say(s){$("msg").textContent=s;clearTimeout(say.t);say.t=setTimeout(()=>$("msg").textContent="",650)}
function nextServer(){serveCount++;if(serveCount>=2){serveCount=0;server=server==="p"?"c":"p"}}
function prepare(){phase="serve";ball.firstBounce=false;me.x=cpu.x=.5;me.target=cpu.target=.5;$("serve").style.display=server==="p"?"block":"none";say(server==="p"?"あなたのサーブ":"CPUサーブ");if(server==="c")setTimeout(cpuServe,700)}
function resetGame(){ps=cs=0;serveCount=0;server="p";prepare();ui()}
function startMatch(){pg=cg=0;gameNo=1;resetGame()}
function point(winner){
 if(winner==="p")ps++;else cs++;ui();say(winner==="p"?"POINT!":"CPU POINT");
 if((ps>=11||cs>=11)&&Math.abs(ps-cs)>=2){
  const win=ps>cs;if(win)pg++;else cg++;const finished=pg>=2||cg>=2;
  phase=finished?"matchover":"gameover";$("over").style.display="flex";
  $("title").textContent=finished?(win?"🏆 MATCH WIN":"MATCH LOST"):(win?"GAME WON":"GAME LOST");
  $("text").textContent=`${ps} - ${cs}　ゲーム ${pg} - ${cg}`;
  $("next").textContent=finished?"もう一度":"次のゲーム";ui();return;
 }
 nextServer();prepare();
}
function launch(target,fromPlayer){
 Object.assign(ball,{x:.5,y:fromPlayer?.74:.26,z:.04,vx:(target-.5)*.18,vy:fromPlayer?-.205:.205,vz:.017,receiver:fromPlayer?"cpu":"player",firstBounce:false});
 phase="serveFlight";
}
function playerServe(){if(phase!=="serve"||server!=="p")return;$("serve").style.display="none";launch(.14+Math.random()*.72,true);say("SERVE")}
function cpuServe(){if(phase!=="serve"||server!=="c")return;launch(.14+Math.random()*.72,false);say("CPU SERVE")}
function playerHit(dx,dy){
 if(phase!=="rally"||ball.receiver!=="player"||ball.y<.54||ball.y>.92||ball.z>.18)return;
 const len=Math.hypot(dx,dy)||1,nx=dx/len,ny=dy/len,target=clamp(ball.x+nx*.38);
 const power=Math.max(.45,Math.min(1,.55-ny*.22));
 me.target=target;ball.receiver="cpu";ball.vx=(target-ball.x)*.20;ball.vy=-(.205+.035*power);ball.vz=.015+.004*power;say(power>.82?"NICE SHOT!":"RETURN");
}
function cpuHit(){if(phase!=="rally"||ball.receiver!=="cpu")return;cpu.target=clamp(ball.x+(Math.random()-.5)*.46);ball.receiver="player";ball.vx=(cpu.target-ball.x)*.20;ball.vy=.205+Math.random()*.015;ball.vz=.0155}
function physics(dt){
 if(phase!=="serveFlight"&&phase!=="rally")return;
 ball.x+=ball.vx*dt*60;ball.y+=ball.vy*dt*60;ball.z+=ball.vz*dt*60;ball.vz-=.00102*dt*60;
 me.x+=(me.target-me.x)*Math.min(1,dt*10);cpu.x+=(cpu.target-cpu.x)*Math.min(1,dt*8);
 if(ball.z<=0){
  ball.z=0;
  const on=ball.x>=.03&&ball.x<=.97&&ball.y>=0&&ball.y<=1;
  if(!on){point(ball.receiver==="player"?"c":"p");return}
  if(phase==="serveFlight"){
   if(server==="p"){
    if(!ball.firstBounce&&ball.y>.455){ball.firstBounce=true;ball.vz=.017;return}
    if(ball.firstBounce&&ball.y<.455){phase="rally";ball.receiver="cpu";setTimeout(cpuHit,500);return}
   }else{
    if(!ball.firstBounce&&ball.y<.455){ball.firstBounce=true;ball.vz=.017;return}
    if(ball.firstBounce&&ball.y>.455){phase="rally";ball.receiver="player";return}
   }
   point(server==="p"?"c":"p");return;
  }
  const valid=(ball.receiver==="player"&&ball.y>.455)||(ball.receiver==="cpu"&&ball.y<.455);
  if(!valid){point(ball.receiver==="player"?"c":"p");return}
  ball.vz=.017;if(ball.receiver==="cpu")setTimeout(cpuHit,500);
 }
 if(ball.x<-.05||ball.x>1.05||ball.y<-.08||ball.y>1.08)point(ball.receiver==="player"?"c":"p");
}
function drawCourt(){
 const t=T(),fl=t.x+t.w*.11,fr=t.x+t.w*.89,nl=t.x,nr=t.x+t.w;
 ctx.fillStyle="#071116";ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#0d6877";ctx.beginPath();ctx.moveTo(fl,t.y);ctx.lineTo(fr,t.y);ctx.lineTo(nr,t.y+t.h);ctx.lineTo(nl,t.y+t.h);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke();
 ctx.beginPath();ctx.moveTo((fl+fr)/2,t.y);ctx.lineTo((nl+nr)/2,t.y+t.h);ctx.stroke();
 ctx.fillStyle="#17272c";ctx.fillRect(nl-3,t.net-7,nr-nl+6,14);ctx.strokeStyle="#e8eeee";ctx.strokeRect(nl-3,t.net-7,nr-nl+6,14);
 ctx.strokeStyle="#263a40";ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(nl+t.w*.17,t.y+t.h);ctx.lineTo(nl+t.w*.17,H-20);ctx.moveTo(nr-t.w*.17,t.y+t.h);ctx.lineTo(nr-t.w*.17,H-20);ctx.stroke();
 if(phase==="rally"&&ball.receiver==="player"){ctx.strokeStyle="#ffffffaa";ctx.lineWidth=2;ctx.beginPath();ctx.arc(nl+ball.x*t.w,t.y+ball.y*t.h,27,0,Math.PI*2);ctx.stroke()}
}
function drawPlayer(px,py,red){
 ctx.save();ctx.translate(px,py);ctx.fillStyle=red?"#b53b4b":"#16839d";ctx.beginPath();ctx.roundRect(-22,-28,44,52,9);ctx.fill();
 ctx.fillStyle="#e0bfa5";ctx.beginPath();ctx.arc(0,-44,16,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#222";ctx.beginPath();ctx.arc(0,-49,16,Math.PI,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#e0bfa5";ctx.lineWidth=8;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-15,-9);ctx.lineTo(-30,15);ctx.moveTo(15,-9);ctx.lineTo(30,15);ctx.stroke();
 ctx.strokeStyle="#ddd";ctx.beginPath();ctx.moveTo(-8,23);ctx.lineTo(-15,50);ctx.moveTo(8,23);ctx.lineTo(15,50);ctx.stroke();
 ctx.strokeStyle="#b78355";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(29,15);ctx.lineTo(41,29);ctx.stroke();
 ctx.fillStyle="#8b5137";ctx.beginPath();ctx.ellipse(43,10,8,11,.3,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawBall(){
 const t=T(),px=t.x+ball.x*t.w,py=t.y+ball.y*t.h,r=5.8+ball.z*17;
 ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(px+2,py+5,r*1.15,r*.45,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff1a8";ctx.beginPath();ctx.arc(px,py-ball.z*H*.14,r,0,Math.PI*2);ctx.fill();
}
function draw(){drawCourt();const t=T();drawPlayer(t.x+t.w*.5+me.x*.01,t.y+t.h+58,false);drawPlayer(t.x+t.w*.5+cpu.x*.01,t.y-52,true);drawBall()}
function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;physics(dt);draw();requestAnimationFrame(loop)}
C.addEventListener("pointerdown",e=>{if(phase==="rally"&&ball.receiver==="player")touch={x:e.clientX,y:e.clientY}});
C.addEventListener("pointerup",e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)>12)playerHit(dx,dy)});
$("serve").onclick=playerServe;
$("next").onclick=()=>{$("over").style.display="none";if(phase==="matchover")startMatch();else{gameNo++;resetGame()}};
startMatch();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
