<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TABLE TENNIS RISE</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}body{display:flex;flex-direction:column}header{height:55px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#091a22;font-weight:900}.title{font-size:13px}#games{font-size:17px}#stage{position:relative;flex:1;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#07131ddd;border:1px solid #49616a;border-radius:9px;padding:6px 9px;font-size:12px}#msg{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;text-shadow:0 3px 14px #000;white-space:nowrap}#serve{display:none;position:absolute;bottom:24px;left:50%;transform:translateX(-50%);border:0;border-radius:16px;padding:16px 38px;background:#1686a7;color:white;font-weight:900;font-size:17px;box-shadow:0 5px 18px #0008;z-index:4}#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:#cbd8dc;z-index:3}#controls{height:80px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:7px;background:#071018}button{border:1px solid #405a64;border-radius:12px;background:#10242d;color:white;font-weight:900}button:active{background:#176d88}#over{display:none;position:absolute;inset:0;background:#000b;align-items:center;justify-content:center;padding:20px}.panel{background:#091821;border:1px solid #536a72;border-radius:20px;padding:22px;width:min(380px,92%);text-align:center}.panel button{width:100%;height:46px;background:#1686a7;border:0;margin-top:10px}</style></head>
<body><header><div class="title">🏓 TABLE TENNIS RISE</div><div id="games">G1　0 - 0</div></header><div id="stage"><canvas id="c"></canvas><div id="hud"><div class="box">YOU <b id="p">0</b></div><div class="box">RALLY <b id="r">0</b></div><div class="box">CPU <b id="q">0</b></div></div><div id="msg"></div><button id="serve">サーブする</button><div id="hint">スワイプ ↑ドライブ ↓ツッツキ　左右でコース</div><div id="over"><div class="panel"><h2 id="ot"></h2><p id="tx"></p><button id="next"></button></div></div></div><div id="controls"><button data-a="drive">🏓<br>ドライブ</button><button data-a="push">🟢<br>ツッツキ</button><button data-a="flick">🔵<br>フリック</button><button data-a="smash">💥<br>スマッシュ</button></div>
<script>
(()=>{"use strict";
const c=document.getElementById("c"),ctx=c.getContext("2d"),E=id=>document.getElementById(id);
const you=E("you"),cpu=E("cpu"),ra=E("rally"),gs=E("games"),gn=E("gameNo"),msg=E("message"),serve=E("serve"),overlay=E("overlay"),ot=E("overTitle"),op=E("overText"),ob=E("overButton");
let W=0,H=0,D=1,last=0,phase="serve",server="player",serveCount=0,ps=0,cs=0,pg=0,cg=0,gameNo=1,rally=0;
let touch=null,serveAim=.5,playerX=.5,cpuX=.5,hitLock=false,pointTimer=0;

const ball={x:.5,y:0,h:.05,vx:0,vy:0,vh:0,receiver:"cpu",spin:0,b1:false,b2:false};
const shot={active:false,target:.5,power:.7,spin:0,type:"drive"};

function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}
addEventListener("resize",resize);resize();

function T(){return{x:W*.08,y:H*.18,w:W*.84,h:H*.55,netY:H*.445}}
function ui(){you.textContent=ps;cpu.textContent=cs;ra.textContent=rally;gs.textContent=pg+" - "+cg;gn.textContent=gameNo}
function say(t,ms=650){msg.textContent=t;clearTimeout(say.t);if(ms)say.t=setTimeout(()=>msg.textContent="",ms)}
function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function nextServer(){serveCount++;if(serveCount>=2){serveCount=0;server=server==="player"?"cpu":"player"}}

function point(who){
 if(phase==="matchover")return;
 if(who==="player")ps++;else cs++;
 ui();say(who==="player"?"POINT!":"CPU POINT",700);
 if((ps>=11||cs>=11)&&Math.abs(ps-cs)>=2){
   const w=ps>cs?"player":"cpu";w==="player"?pg++:cg++;ui();
   const done=pg>=2||cg>=2;phase=done?"matchover":"gameover";overlay.style.display="flex";
   ot.textContent=done?(pg>cg?"🏆 MATCH WIN!":"MATCH LOST"):(w==="player"?"GAME WON!":"GAME LOST");
   op.textContent=done?`3ゲームマッチ　${pg} - ${cg}`:`ゲーム${gameNo}　${ps} - ${cs}`;
   ob.textContent=done?"もう一度":"次のゲーム";return;
 }
 nextServer();resetPoint();
}

function resetPoint(){
 phase="serve";hitLock=false;shot.active=false;ball.b1=false;ball.b2=false;serveAim=.5;
 serve.style.display=server==="player"?"block":"none";ui();
 say(server==="player"?"あなたのサーブ":"CPUサーブ",0);
 if(server==="cpu")setTimeout(cpuServe,700);
}

function resetGame(){ps=0;cs=0;server="player";serveCount=0;rally=0;playerX=.5;cpuX=.5;resetPoint()}
function newMatch(){pg=0;cg=0;gameNo=1;resetGame()}

function servePlayer(){
 if(phase!=="serve"||server!=="player")return;
 serve.style.display="none";
 // The serve aim is chosen from the player's latest horizontal touch/drag.
 const target=clamp(.5+(serveAim-.5)*.9);
 Object.assign(ball,{x:.5,y:.72,h:.045,vx:(target-.5)*.34,vy:-.34,vh:.018,receiver:"cpu",spin:(serveAim-.5)*.8,b1:false,b2:false});
 phase="serveFlight";say("SERVE!",500);
}

function cpuServe(){
 if(phase!=="serve"||server!=="cpu")return;
 serve.style.display="none";
 const target=clamp(.18+Math.random()*.64);
 Object.assign(ball,{x:.5,y:.28,h:.045,vx:(target-.5)*.28,vy:.34,vh:.018,receiver:"player",spin:(Math.random()-.5)*.8,b1:false,b2:false});
 phase="serveFlight";say("CPU SERVE",500);
}

function registerPlayerHit(dx,dy){
 if(phase!=="rally"||ball.receiver!=="player"||hitLock)return;
 const t=T(); if(ball.y<t.netY+H*.025||ball.h>.30)return;
 hitLock=true;
 const d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
 const timing=clamp(1-Math.abs(ball.y-(t.y+t.h*.82))/(H*.20),.18,1);
 const target=clamp(ball.x+nx*.38);
 const power=clamp(.42+timing*.62+Math.max(0,-ny)*.12,.42,1.12);
 ball.receiver="cpu";ball.vx=(target-ball.x)*.40;ball.vy=-.285-power*.052;
 ball.vh=.018+power*.006;ball.spin=clamp((-ny*.75)+(nx*.25),-1,1);
 playerX=target;rally++;ui();
 say(timing>.82?"NICE SHOT!":timing>.52?"GOOD!":"RETURN",320);
 setTimeout(()=>hitLock=false,190);
}
function cpuReturn(){
 if(phase!=="rally"||ball.receiver!=="cpu")return;
 const target=clamp(ball.x+(Math.random()-.5)*.42);
 cpuX=target;
 const quality=.68+Math.random()*.22;
 ball.receiver="player";ball.vx=(target-ball.x)*.42;ball.vy=.30+.025*(1-quality);ball.vh=.018+.005*quality;
 ball.spin=(Math.random()-.5)*.55;rally++;ui();
}

function bounce(isServe){
 const t=T();
 const half=ball.y>t.netY;
 if(isServe){
   if(server==="player"){
     if(!ball.b1&&!half){ball.b1=true;ball.vh=.018;ball.vy=-Math.abs(ball.vy);return true}
     if(ball.b1&&half&&!ball.b2){ball.b2=true;phase="rally";ball.receiver="cpu";return true}
   }else{
     if(!ball.b1&&half){ball.b1=true;ball.vh=.018;ball.vy=Math.abs(ball.vy);return true}
     if(ball.b1&&!half&&!ball.b2){ball.b2=true;phase="rally";ball.receiver="player";return true}
   }
   return false;
 }
 if(ball.receiver==="cpu"&&!half){ball.vh=.018;ball.vy=-Math.abs(ball.vy);ball.receiver="player";return true}
 if(ball.receiver==="player"&&half){ball.vh=.018;ball.vy=Math.abs(ball.vy);ball.receiver="cpu";return true}
 return false;
}

function physics(dt){
 const t=T();
 if(phase!=="serveFlight"&&phase!=="rally")return;
 const speed=phase==="serveFlight"?.92:.78;
 ball.x+=ball.vx*dt*60*speed;
 ball.y+=ball.vy*dt*60*speed;
 ball.h+=ball.vh*dt*60;
 ball.vh-=.00135*dt*60;
 ball.vx*=.999;
 if(ball.h<0)ball.h=0;

 if(ball.x<-.03||ball.x>1.03){point(ball.receiver==="player"?"cpu":"player");return}

 if(ball.h<=0){
   ball.h=0;
   const on=ball.x>=.02&&ball.x<=.98&&ball.y>=t.y/H&&ball.y<=(t.y+t.h)/H;
   if(!on){point(ball.receiver==="player"?"cpu":"player");return}
   if(!bounce(phase==="serveFlight")){point(ball.receiver==="player"?"cpu":"player");return}
   if(phase==="rally"){
     if(ball.receiver==="cpu")setTimeout(cpuReturn,260+Math.random()*160);
   }
 }
 // out beyond the physical table boundaries
 if(ball.y<-.04||ball.y>1.04){point(ball.receiver==="player"?"cpu":"player");return}
 // CPU gets a visual reaction window, player must hit manually.
}

function drawTable(){
 const t=T();
 ctx.fillStyle="#071018";ctx.fillRect(0,0,W,H);
 // floor
 ctx.fillStyle="#0b171d";ctx.fillRect(0,t.y+t.h*.98,W,H);
 // table top in perspective
 ctx.fillStyle="#0e6875";
 ctx.beginPath();
 ctx.moveTo(t.x+t.w*.08,t.y);ctx.lineTo(t.x+t.w*.92,t.y);
 ctx.lineTo(t.x+t.w,t.y+t.h);ctx.lineTo(t.x,t.y+t.h);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#f4f8f8";ctx.lineWidth=2.2;ctx.stroke();
 // center and end lines
 ctx.beginPath();ctx.moveTo(t.x+t.w*.08,t.netY);ctx.lineTo(t.x+t.w*.92,t.netY);ctx.stroke();
 ctx.beginPath();ctx.moveTo(t.x+t.w*.5,t.y);ctx.lineTo(t.x+t.w*.5,t.y+t.h);ctx.stroke();
 // legs
 ctx.fillStyle="#1c2b31";
 for(const side of [0,1]){
   const lx=side?t.x+t.w*.86:t.x+t.w*.14;
   ctx.fillRect(lx,t.y+t.h,8,H-t.y-t.h-14);
   ctx.fillRect(lx-10,H-20,28,7);
 }
 // net
 ctx.fillStyle="#16252b";ctx.fillRect(t.x-3,t.netY-6,t.w+6,12);
 ctx.strokeStyle="#dbe5e7";ctx.strokeRect(t.x-3,t.netY-6,t.w+6,12);
 // landing marker
 if(phase==="rally"){
   const px=t.x+ball.x*t.w;
   ctx.strokeStyle="#ffffffaa";ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,t.y+t.h*.83,18,0,Math.PI*2);ctx.stroke();
 }
}

function drawPlayer(px,py,isCpu,scale,moveX){
 ctx.save();ctx.translate(px,py);ctx.scale(scale,scale);
 ctx.translate(moveX*16,0);
 ctx.strokeStyle="#d8dde0";ctx.lineWidth=9;ctx.lineCap="round";
 ctx.beginPath();ctx.moveTo(-7,18);ctx.lineTo(-18,58);ctx.moveTo(7,18);ctx.lineTo(18,58);ctx.stroke();
 ctx.strokeStyle="#111820";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-22,58);ctx.lineTo(-4,58);ctx.moveTo(4,58);ctx.lineTo(22,58);ctx.stroke();
 ctx.fillStyle=isCpu?"#b63b4b":"#16839d";ctx.beginPath();ctx.roundRect(-24,-32,48,52,9);ctx.fill();
 ctx.fillStyle="#e1c1a5";ctx.beginPath();ctx.arc(0,-48,17,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#26292b";ctx.beginPath();ctx.arc(0,-54,17,Math.PI,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#e1c1a5";ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(-34,5);ctx.moveTo(18,-18);ctx.lineTo(34,5);ctx.stroke();
 ctx.restore();
}

function drawBall(){
 const t=T(),px=t.x+ball.x*t.w,py=ball.y*H;
 const by=py-ball.h*H*.42,r=6+ball.h*18;
 ctx.fillStyle="#0007";ctx.beginPath();ctx.ellipse(px+2,py+5,r*1.15,r*.5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff1a8";ctx.beginPath();ctx.arc(px,by,r,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#fff";ctx.lineWidth=1;ctx.stroke();
}

function draw(){
 drawTable();
 const t=T();
 drawPlayer(t.x+t.w*.5,t.y+t.h+22,false,Math.max(.72,Math.min(1.05,W/390)),playerX-.5);
 drawPlayer(t.x+t.w*.5,t.y-24,true,Math.max(.72,Math.min(1.05,W/390)),cpuX-.5);
 drawBall();
 // player contact guide
 if(phase==="rally"&&ball.receiver==="player"){
   ctx.strokeStyle="#ffffff55";ctx.lineWidth=1;ctx.beginPath();ctx.arc(t.x+ball.x*t.w,t.y+t.h*.86,28,0,Math.PI*2);ctx.stroke();
 }
}

function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;physics(dt);draw();requestAnimationFrame(loop)}

c.addEventListener("pointerdown",e=>{
 const r=c.getBoundingClientRect();
 if(phase==="serve"&&server==="player"){touch={x:e.clientX,y:e.clientY};serveAim=clamp((e.clientX-r.left)/r.width);return}
 if(phase==="rally"&&ball.receiver==="player")touch={x:e.clientX,y:e.clientY};
});
c.addEventListener("pointermove",e=>{
 if(!touch)return; const r=c.getBoundingClientRect();
 if(phase==="serve"&&server==="player")serveAim=clamp((e.clientX-r.left)/r.width);
});
c.addEventListener("pointerup",e=>{
 if(!touch)return; const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;
 if(phase==="serve"&&server==="player"){const r=c.getBoundingClientRect();serveAim=clamp((e.clientX-r.left)/r.width);return}
 if(phase==="rally"&&ball.receiver==="player"&&Math.hypot(dx,dy)>10)registerPlayerHit(dx,dy);
});

ob.onclick=()=>{overlay.style.display="none";if(phase==="matchover")newMatch();else{gameNo++;resetGame()}};
newMatch();requestAnimationFrame(loop);
})();
</script></body></html>
