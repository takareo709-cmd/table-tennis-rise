<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071116}#a{width:min(100vw,520px);height:100dvh;margin:auto;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:12px;left:12px;right:12px;color:white;display:flex;justify-content:space-between;font:bold 18px -apple-system;padding:7px;background:#0008;border-radius:12px}.hint{position:absolute;bottom:14px;left:12px;right:12px;text-align:center;color:white;background:#0008;padding:9px;border-radius:12px;font:13px -apple-system}.serve{position:absolute;bottom:65px;left:50%;transform:translateX(-50%);padding:13px 24px;border:0;border-radius:14px;font-weight:bold}.msg{position:absolute;top:65px;left:50%;transform:translateX(-50%);color:white;font:bold 18px -apple-system}.ov{display:none;position:absolute;inset:0;background:#0009;align-items:center;justify-content:center}.card{background:#102027;color:white;padding:25px;border-radius:20px;text-align:center}.card button{padding:12px 22px;border:0;border-radius:12px;font-weight:bold}
</style></head><body><div id="a"><canvas id="c"></canvas><div class="hud"><span>YOU <b id="you">0</b>　CPU <b id="cpu">0</b></span><span>GAME <b id="game">1</b>　<b id="games">0-0</b></span></div><div id="msg" class="msg"></div><button id="serve" class="serve">サーブする</button><div class="hint">ボールが自分側に来たらスワイプ　←→コース　↑強く　↓弱く</div><div id="ov" class="ov"><div class="card"><h2 id="title"></h2><p id="txt"></p><button id="ok">続ける</button></div></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=i=>document.getElementById(i);let W,H,D,last=0,touch=null,phase='serve',server='p',sn=0,p=0,q=0,gw=0,gl=0,g=1,rally=0;
const b={x:.5,y:.72,z:.04,vx:0,vy:0,vz:0,recv:'cpu',b1:false,b2:false};
function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const T=()=>({x:W*.08,y:H*.17,w:W*.84,h:H*.57,net:H*.455}),cl=v=>Math.max(0,Math.min(1,v));
function ui(){$('you').textContent=p;$('cpu').textContent=q;$('games').textContent=gw+'-'+gl;$('game').textContent=g}
function say(s){$('msg').textContent=s;clearTimeout(say.t);say.t=setTimeout(()=>$('msg').textContent='',600)}
function next(){sn++;if(sn>=2){sn=0;server=server==='p'?'c':'p'}}
function reset(){phase='serve';b.b1=b.b2=false;$('serve').style.display=server==='p'?'block':'none';if(server==='c')setTimeout(cpuServe,700);ui()}
function point(w){w==='p'?p++:q++;ui();say(w==='p'?'POINT':'CPU POINT');if((p>=11||q>=11)&&Math.abs(p-q)>=2){let win=p>q;win?gw++:gl++;let done=gw>=2||gl>=2;$('ov').style.display='flex';$('title').textContent=done?(win?'🏆 MATCH WIN':'MATCH LOST'):(win?'GAME WON':'GAME LOST');$('txt').textContent=p+' - '+q;$('ok').textContent=done?'もう一度':'次のゲーム';phase=done?'matchover':'gameover';return}next();reset()}
function launch(target,fromP){Object.assign(b,{x:.5,y:fromP?.74:.26,z:.04,vx:(target-.5)*.18,vy:fromP?-.215:.215,vz:.017,recv:fromP?'cpu':'player',b1:false,b2:false});phase='serveFlight'}
function cpuServe(){if(phase!=='serve'||server!=='c')return;launch(.16+Math.random()*.68,false);say('CPU SERVE')}
$('serve').onclick=()=>{if(phase!=='serve'||server!=='p')return;$('serve').style.display='none';launch(.16+Math.random()*.68,true);say('SERVE')}
function hit(dx,dy){if(phase!=='rally'||b.recv!=='player'||b.y<.55||b.y>.92||b.z>.2)return;let d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,target=cl(b.x+nx*.34),power=Math.max(.4,Math.min(1,.55-ny*.22));b.recv='cpu';b.vx=(target-b.x)*.21;b.vy=-(.205+.035*power);b.vz=.015+.004*power;rally++;ui();say(power>.8?'NICE!':'RETURN')}
function cpuHit(){if(phase!=='rally'||b.recv!=='cpu')return;let target=cl(b.x+(Math.random()-.5)*.46);b.recv='player';b.vx=(target-b.x)*.21;b.vy=.205+Math.random()*.018;b.vz=.015+.003*Math.random();rally++;ui()}
function physics(dt){if(phase!=='serveFlight'&&phase!=='rally')return;b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;b.z+=b.vz*dt*60;b.vz-=.00105*dt*60;if(b.z<=0){b.z=0;let on=b.x>=.04&&b.x<=.96&&b.y>=0&&b.y<=1;if(!on){point(b.recv==='player'?'c':'p');return}
if(phase==='serveFlight'){if(server==='p'){if(!b.b1&&b.y>.455){b.b1=true;b.vz=.017;return}if(b.b1&&b.y<.455&&!b.b2){b.b2=true;phase='rally';b.recv='cpu';setTimeout(cpuHit,480);return}}else{if(!b.b1&&b.y<.455){b.b1=true;b.vz=.017;return}if(b.b1&&b.y>.455&&!b.b2){b.b2=true;phase='rally';b.recv='player';return}}point(server==='p'?'c':'p');return}
let valid=(b.recv==='player'&&b.y>.455)||(b.recv==='cpu'&&b.y<.455);if(!valid){point(b.recv==='player'?'c':'p');return}b.vz=.017;if(b.recv==='cpu')setTimeout(cpuHit,480)}
if(b.x<-.04||b.x>1.04||b.y<-.06||b.y>1.06)point(b.recv==='player'?'c':'p')}
function draw(){let t=T();x.fillStyle='#061015';x.fillRect(0,0,W,H);x.fillStyle='#0b171c';x.fillRect(0,t.y+t.h*.97,W,H);let fl=t.x+t.w*.11,fr=t.x+t.w*.89,nl=t.x,nr=t.x+t.w;x.fillStyle='#0d6876';x.beginPath();x.moveTo(fl,t.y);x.lineTo(fr,t.y);x.lineTo(nr,t.y+t.h);x.lineTo(nl,t.y+t.h);x.closePath();x.fill();x.strokeStyle='white';x.lineWidth=2;x.stroke();x.beginPath();x.moveTo((fl+fr)/2,t.y);x.lineTo((nl+nr)/2,t.y+t.h);x.stroke();x.fillStyle='#17272c';x.fillRect(nl-3,t.net-6,nr-nl+6,12);x.strokeRect(nl-3,t.net-6,nr-nl+6,12);x.strokeStyle='#26383e';x.lineWidth=6;x.beginPath();x.moveTo(nl+t.w*.17,t.y+t.h);x.lineTo(nl+t.w*.17,H-24);x.moveTo(nr-t.w*.17,t.y+t.h);x.lineTo(nr-t.w*.17,H-24);x.stroke();
function person(px,py,cpu){x.save();x.translate(px,py);x.fillStyle=cpu?'#b53b4b':'#16829c';x.beginPath();x.roundRect(-22,-24,44,48,8);x.fill();x.fillStyle='#e0bfa4';x.beginPath();x.arc(0,-39,15,0,7);x.fill();x.fillStyle='#222';x.beginPath();x.arc(0,-44,15,Math.PI,2*Math.PI);x.fill();x.strokeStyle='#e0bfa4';x.lineWidth=7;x.beginPath();x.moveTo(-15,-10);x.lineTo(-29,12);x.moveTo(15,-10);x.lineTo(29,12);x.stroke();x.restore()}
person(nl+t.w/2,t.y+t.h+55,false);person(nl+t.w/2,t.y-52,true);let px=nl+b.x*t.w,py=t.y+b.y*t.h,r=5.5+b.z*16;x.fillStyle='#0006';x.beginPath();x.ellipse(px+2,py+4,r*1.1,r*.45,0,0,7);x.fill();x.fillStyle='#fff0a0';x.beginPath();x.arc(px,py-b.z*H*.14,r,0,7);x.fill()}
function loop(ts){let dt=Math.min(.033,(ts-last)/1000||.016);last=ts;physics(dt);draw();requestAnimationFrame(loop)}
c.onpointerdown=e=>{if(phase==='rally'&&b.recv==='player')touch={x:e.clientX,y:e.clientY}};c.onpointerup=e=>{if(touch){let dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.hypot(dx,dy)>12)hit(dx,dy)}};$('ok').onclick=()=>{$('ov').style.display='none';if(phase==='matchover'){gw=gl=0;g=1;p=q=0;server='p';sn=0}else{g++ ;p=q=0;server='p';sn=0}reset()};reset();requestAnimationFrame(loop);
</script></body></html>
